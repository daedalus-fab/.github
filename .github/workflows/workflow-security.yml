name: Workflow supply-chain and Rust script policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-script-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Assert checkout matches event revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned Rust toolchain action
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Rust policy formatting
        run: cargo fmt --manifest-path tools/rust-script-policy/Cargo.toml --check
      - name: Rust policy lint
        run: cargo clippy --manifest-path tools/rust-script-policy/Cargo.toml --all-targets -- -D warnings
      - name: Rust policy positive and negative regression tests
        run: cargo test --manifest-path tools/rust-script-policy/Cargo.toml --all-targets
      - name: Forbid new Python automation and require immutable action pins
        run: cargo run --quiet --manifest-path tools/rust-script-policy/Cargo.toml -- all .
      - name: Verify validation did not mutate tracked state
        run: git diff --exit-code
